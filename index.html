<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colecția de jocuri</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131925">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef1f6;--fg:#1c2230;--muted:#5b6578;--card:#ffffff;--btn:#2d6cdf;--btnfg:#ffffff}
@media (prefers-color-scheme: dark){:root{--bg:#121620;--fg:#e8ecf5;--muted:#9aa5ba;--card:#1b2332;--btn:#4c8dff;--btnfg:#0b1020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
h1{margin:0;font-size:24px}
#status{font-size:13px;color:var(--muted);margin:0 0 16px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;background:var(--card);color:inherit;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
a.card:focus-visible,button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
a.card .ico{width:56px;height:56px;border-radius:14px}
a.card h2{margin:6px 0 0;font-size:18px}
a.card p{margin:0;font-size:13px;color:var(--muted)}
section.breaks{margin-top:28px;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.12)}
section.breaks h2{margin:0 0 6px;font-size:16px}
section.breaks p{margin:0 0 10px;font-size:13px;color:var(--muted)}
details.admin{margin-top:28px;padding-top:12px;border-top:1px solid var(--muted)}
details.admin summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
details.admin ul{margin:10px 0 0;padding-left:20px;font-size:14px}
details.admin li{margin:6px 0}
details.admin a{color:var(--btn)}
details.admin small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Colecția de jocuri</h1>
    <button id="install" type="button" hidden>Instalează aplicația</button>
  </header>
  <p id="status"></p>
  <div class="grid" id="apps"></div>
  <section class="breaks">
    <h2>Pauze</h2>
    <p id="bstat"></p>
  </section>
  <details class="admin">
    <summary>Zonă admin</summary>
    <ul>
      <li><a href="apps/mahjong/editor.html">Generator de forme Mahjong</a><br><small>Generezi și previzualizezi forma unui nivel; se folosește în joc doar în sesiunea curentă. Nivelurile fără formă salvată rămân random.</small></li>
    </ul>
  </details>
</main>
<script src="breaks.js"></script>
<script>
// Pentru a adăuga o aplicație: pune-o în apps/<id>/, apoi adaug-o aici și în PRECACHE din sw.js.
const APPS=[
  {id:'screw-puzzle',name:'Screw Puzzle 3D',desc:'Scoate șuruburile și umple cutiile colorate.',icon:'icons/icon.svg'},
  {id:'solitaire',name:'Solitaire',desc:'Klondike clasic, cu mutare prin atingere sau tragere.',icon:'icons/solitaire.svg'},
  {id:'mahjong',name:'Mahjong',desc:'Perechi de piese cu modele random, niveluri tot mai complexe.',icon:'icons/mahjong.svg'},
  {id:'arrows',name:'Săgeți',desc:'Scoate săgețile în ordinea potrivită, fără să le blochezi. Antrenează planificarea.',icon:'icons/arrows.svg'},
  {id:'watersort',name:'Sortare culori',desc:'Toarnă culorile până fiecare tub are una singură. Antrenează memoria de lucru.',icon:'icons/watersort.svg'},
  {id:'sudoku',name:'Sudoku',desc:'Completează grila cu logică; fiecare puzzle are o singură soluție.',icon:'icons/sudoku.svg'}
];
const grid=document.getElementById('apps');
for(const a of APPS){
  const el=document.createElement('a');
  el.className='card';el.href='apps/'+a.id+'/';
  const img=document.createElement('img');img.className='ico';img.src=a.icon;img.alt='';
  const h=document.createElement('h2');h.textContent=a.name;
  const p=document.createElement('p');p.textContent=a.desc;
  el.append(img,h,p);grid.append(el);
}

const status=document.getElementById('status');
function showStatus(){
  status.textContent=navigator.onLine?'':'Ești offline — jocurile salvate funcționează în continuare.';
}
addEventListener('online',showStatus);addEventListener('offline',showStatus);showStatus();

// pauze: timp de joc cumulat pe toate jocurile (setările sunt fixe)
(function(){
  const st=document.getElementById('bstat');
  if(!window.GBreak)return;
  function upd(){
    const s=GBreak.status();
    st.textContent='Ai jucat '+s.playedMin+' din '+s.limitMin+' min. La limită primești un memento: poți amâna de '+s.maxSnooze+' ori câte 10 minute, apoi jocurile se blochează '+s.breakMin+' minute.';
  }
  upd();setInterval(upd,5000);
})();

let deferred=null;
const btn=document.getElementById('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false});
btn.addEventListener('click',async()=>{
  if(!deferred)return;
  deferred.prompt();await deferred.userChoice;deferred=null;btn.hidden=true;
});
addEventListener('appinstalled',()=>{btn.hidden=true});
</script>
<script src="pwa.js"></script>
</body>
</html>
